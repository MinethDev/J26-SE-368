# Infrastructure for local development.
#   docker compose up -d mongo              -> MongoDB only (needed by the platform)
#   docker compose --profile quality up -d  -> MongoDB + SonarQube (for the quality component)
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  sonarqube:
    image: sonarqube:community
    profiles: ["quality"]
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data

volumes:
  mongo-data:
  sonarqube-data:
